[package]
name = "chromelight"
description = "ChromeLight browser — single binary, process role selected by --type"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "chromelight"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cl-ipc.workspace = true
cl-net.workspace = true
cl-fonts.workspace = true
cl-gfx.workspace = true
cl-paint = { workspace = true, features = ["serde"] }
cl-renderer.workspace = true
# IpcSender / IpcSharedMemory for the display-list channel (already the transport of cl-ipc).
ipc-channel.workspace = true
cl-platform.workspace = true
cl-process.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `Rect` for asserting a display list's bounds in the renderer tests.
cl-layout.workspace = true
# Builds a FontKey the bundled database does not know (gpu tests): it is a u32 on the wire.
postcard.workspace = true

[lints]
workspace = true
