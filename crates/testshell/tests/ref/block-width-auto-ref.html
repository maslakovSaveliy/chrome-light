<!doctype html>
<!-- Reference for block-width-auto.html: an explicit 800x50 black div at the origin,
     reproducing width:auto's fill-the-containing-block result (CSS 2.1 SS10.3.3) without
     relying on auto itself. -->
<html>
<head>
<style>
  body { margin: 0; }
  div { width: 800px; height: 50px; background: #000; }
</style>
</head>
<body>
<div></div>
</body>
</html>
