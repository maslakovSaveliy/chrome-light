<!doctype html>
<!-- Reference for anonymous-block-wrapping.html: the three 20x20 glyph squares, placed
     directly at their computed positions via plain margins - no anonymous-block machinery
     needed once the geometry is worked out by hand. -->
<html>
<head>
<style>
  body { margin: 0; }
  div { width: 20px; height: 20px; background: #000; }
  #b2 { margin-top: 20px; }
  #b3 { margin-top: 20px; }
</style>
</head>
<body>
<div id="b1"></div>
<div id="b2"></div>
<div id="b3"></div>
</body>
</html>
