<!doctype html>
<!-- expects: a single black bar at (0,0) 50x50. The display:none div generates no box at
     all - not even an invisible one - so it takes no space and paints nothing, regardless of
     its huge declared size. -->
<html>
<head>
<link rel="stylesheet" href="fonts.css">
<style>
  body { margin: 0; }
  div { font-family: Ahem; font-size: 20px; line-height: 20px; }
  #hidden { display: none; width: 9000px; height: 9000px; background: #f00; }
  #visible { width: 50px; height: 50px; background: #000; }
</style>
</head>
<body>
<div id="hidden"></div>
<div id="visible"></div>
</body>
</html>
