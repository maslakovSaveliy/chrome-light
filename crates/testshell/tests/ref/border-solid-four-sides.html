<!doctype html>

     painter draws four axis-aligned strips, no mitred corners
     (crates/gfx/src/cpu/mod.rs). Content (5,5)-(105,65) stays canvas white (no background). -->
<html>
<head>

<style>
  body { margin: 0; }

    font-family: Ahem; font-size: 20px; line-height: 20px;
    width: 100px; height: 60px;
    border-top: 5px solid #f00;
    border-right: 5px solid #00f;
    border-bottom: 5px solid #0f0;
    border-left: 5px solid #fa0;
  }
</style>
</head>
<body>
<div></div>
</body>
</html>
