<!doctype html>
<!-- Reference for padding-blocks-collapse.html: the parent's visible blue band (25px, padding
     plus the uncollapsed gap) and the child's black band (10px) as two plain stacked divs. -->
<html>
<head>
<style>
  body { margin: 0; }
  div { width: 150px; }
  #top { height: 25px; background: #00f; }
  #bottom { height: 10px; background: #000; }
</style>
</head>
<body>
<div id="top"></div>
<div id="bottom"></div>
</body>
</html>
