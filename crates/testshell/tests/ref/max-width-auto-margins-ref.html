<!doctype html>
<!-- Reference for max-width-auto-margins.html: the same 400x50 black box, placed by an
     explicit width and an explicit 200px margin-left instead of an auto width clamped by
     max-width and centred by auto margins. -->
<html>
<head>
<style>
  body { margin: 0; }
  div { width: 400px; height: 50px; margin: 0 0 0 200px; background: #000; }
</style>
</head>
<body>
<div></div>
</body>
</html>
