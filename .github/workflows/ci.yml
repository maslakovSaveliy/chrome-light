name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 --version
      - run: rustup show   # installs the toolchain from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo deny check
      - run: cargo doc --workspace --no-deps
      - run: bash scripts/check-agents-md.sh
      - run: bash tools/check-platform-cfg.sh
      - run: bash tools/check-unsafe-scope.sh
      - run: bash tools/check-stylo-scope.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 --version
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo nextest run --workspace --locked
        env:
          # `crates/testshell/tests/smoke.rs` (and `crates/layout/tests/block.rs`'s own
          # deep-chain smoke test) budget their timing-sensitive assertions at 5s locally,
          # 15s here — a shared/loaded CI runner is slower than a developer's machine, and
          # the plan explicitly sanctions this escape hatch ("on CI allow 15 s via env
          # CL_SMOKE_SLOW=1").
          CL_SMOKE_SLOW: "1"
      - run: cargo test --workspace --doc --locked
      # The reftest suite runs twice on purpose. `cargo nextest run` above already runs it as
      # `crates/testshell/tests/reftests.rs` (which also asserts the pair count, so a pair
      # added without updating EXPECTED_PAIR_COUNT fails there); this step runs the same suite
      # through the shipping CLI, which is what a developer runs locally and what the plan's
      # acceptance criterion names. The duplication costs ~0.3s and catches a CLI-only
      # regression — an argument-parsing or exit-code break — that the library test cannot see.
      - run: cargo run -p cl-testshell -- reftest
      - name: upload reftest failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reftest-failures-${{ matrix.os }}
          path: target/reftest-failures
      - name: release build refuses unsandboxed renderer (Gate S0)
        shell: bash
        run: |
          cargo build --release -p chromelight --locked
          set +e
          ./target/release/chromelight --exit-after-handshake --no-sandbox
          code=$?
          set -e
          test "$code" -ne 0

  fuzz-short:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 --version
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: for t in ipc_decode url_parse html_parse css_stylesheet display_list_validate display_list_rasterize; do cargo +nightly fuzz run --fuzz-dir tools/fuzz --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=45; done
